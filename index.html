<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Alert Live Console (Telegram Style)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-scroll::-webkit-scrollbar { width: 6px; }
        .chat-scroll::-webkit-scrollbar-track { background: #0f172a; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        /* 隱藏 details 預設的原生三角形 */
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <!-- 頂部導覽列 -->
    <header class="bg-slate-900/90 border-b border-slate-800 p-4 sticky top-0 z-50 backdrop-blur flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">📡</span>
            <div>
                <h1 class="text-lg font-extrabold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                    股票即時監控 & Telegram 動態頻道
                </h1>
                <p class="text-[11px] text-slate-400">13 ML模型預測 x 實時條件警訊與 AI 期權推播</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <span class="relative flex h-3 w-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
            </span>
            <span class="text-xs text-slate-300 font-semibold">Live 輪詢中</span>
        </div>
    </header>

    <main class="p-4 max-w-[1400px] mx-auto space-y-4">
        
        <!-- 股票管理與追蹤列 -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-wrap items-center justify-between gap-4 shadow-lg">
            <div class="flex items-center gap-2">
                <span class="text-lg">🎯</span>
                <h2 class="font-bold text-slate-200">追蹤股票清單</h2>
            </div>
            
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <input type="text" id="stock-input" placeholder="輸入代碼 (例: AAPL, 2330.TW)" 
                       onkeypress="if(event.key === 'Enter') addStock()"
                       class="bg-slate-950 border border-slate-700 text-slate-100 text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-cyan-500 uppercase flex-1 sm:w-60">
                <button onclick="addStock()" 
                        class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white font-bold text-sm px-4 py-2 rounded-lg transition shadow">
                    + 追蹤
                </button>
            </div>
        </div>

        <!-- 追蹤標的即時價格與期權建議卡片 -->
        <div id="ticker-bar" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
            <!-- JavaScript 動態填入 -->
        </div>

        <!-- 主頻道區域 (Telegram 訊息串視窗) -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl flex flex-col h-[700px] shadow-2xl">
            <!-- 頻道頂部工具欄 -->
            <div class="p-3 border-b border-slate-800 flex justify-between items-center bg-slate-900/90 rounded-t-xl">
                <div class="flex items-center gap-2">
                    <span class="text-xl">📢</span>
                    <span class="font-bold text-slate-200"> Telegram 訊息推播頻道</span>
                </div>
                <!-- 篩選按鈕區 -->
                <div class="flex items-center gap-1.5 text-xs">
                    <button onclick="filterFeed('ALL')" id="filter-ALL" class="px-2.5 py-1 rounded bg-cyan-600 text-white font-bold">全部</button>
                    <button onclick="filterFeed('ALERT')" id="filter-ALERT" class="px-2.5 py-1 rounded bg-slate-800 text-slate-400 hover:bg-slate-700">🚨 警訊</button>
                    <button onclick="filterFeed('ML')" id="filter-ML" class="px-2.5 py-1 rounded bg-slate-800 text-slate-400 hover:bg-slate-700">🤖 13-ML預測</button>
                    <button onclick="filterFeed('OPTIONS')" id="filter-OPTIONS" class="px-2.5 py-1 rounded bg-slate-800 text-slate-400 hover:bg-slate-700">🎯 期權建議</button>
                </div>
            </div>

            <!-- Telegram 風格對話框滾動區 -->
            <div id="chat-feed" class="flex-1 p-4 overflow-y-auto space-y-3 chat-scroll bg-slate-950/70">
                <!-- Telegram 訊息卡片 -->
            </div>
        </section>

    </main>

    <script>
        let currentFilter = 'ALL';
        let rawFeedData = [];
        let latestStates = {};

        // 使用 Set 穩固記憶使用者手動展開的項目
        const expandedTickerOptions = new Set();
        const expandedFeedMessages = new Set();

        // 產生絕對穩定 ID 的雜湊函數 (不受陣列變動影響)
        function generateHash(str) {
            let hash = 0;
            if (str.length === 0) return hash;
            for (let i = 0; i < str.length; i++) {
                let char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return Math.abs(hash).toString(36);
        }

        // 攔截並控制所有展開/折疊行為
        function handleToggle(e, id, type) {
            e.preventDefault(); // 阻止原生 details 行為，交由 React-like 的方式統一控制狀態
            if (type === 'ticker') {
                if (expandedTickerOptions.has(id)) expandedTickerOptions.delete(id);
                else expandedTickerOptions.add(id);
                renderTickerBar();
            } else if (type === 'feed') {
                if (expandedFeedMessages.has(id)) expandedFeedMessages.delete(id);
                else expandedFeedMessages.add(id);
                renderFeed();
            }
        }

        // 渲染頂部股票卡片區塊
        function renderTickerBar() {
            const tickerBar = document.getElementById('ticker-bar');
            if (!latestStates || Object.keys(latestStates).length === 0) return;

            tickerBar.innerHTML = Object.entries(latestStates).map(([symbol, stockState]) => {
                const price = stockState.current_price;
                const opt = stockState.options_rec;
                const isExpanded = expandedTickerOptions.has(symbol);
                
                let optBadge = '<span class="text-slate-500">無期權建議</span>';
                let hasDetails = false;

                if (opt) {
                    if (opt.action === 'BUY_CALL') optBadge = `<span class="text-emerald-400 font-bold">${opt.strategy || 'BUY CALL'}</span>`;
                    else if (opt.action === 'SELL_PUT') optBadge = `<span class="text-purple-400 font-bold">${opt.strategy || 'SELL PUT'}</span>`;
                    else optBadge = `<span class="text-slate-300 font-bold">${opt.strategy || opt.action || '期權建議'}</span>`;

                    if (opt.strike_price || opt.take_profit_target || opt.stop_loss) {
                        hasDetails = true;
                    }
                }

                return `
                    <div class="relative p-3 rounded-xl border bg-slate-900 border-slate-800 text-left group hover:border-slate-700 transition space-y-2">
                        <button onclick="removeStock('${symbol}')" 
                                class="absolute top-1 right-2 text-slate-500 hover:text-red-400 font-bold text-xs p-1 z-10" 
                                title="移除追蹤">✕</button>
                        
                        <div class="flex justify-between items-center pr-4">
                            <span class="text-xs text-slate-400 font-bold">${symbol}</span>
                            <span class="text-sm font-bold text-emerald-400 font-mono">$${price ? price.toFixed(2) : '---'}</span>
                        </div>

                        <!-- 期權折疊選單區塊 -->
                        <details ${isExpanded ? 'open' : ''} class="text-[11px] border-t border-slate-800/80 pt-1 transition-all">
                            <summary onclick="handleToggle(event, '${symbol}', 'ticker')" 
                                     class="${hasDetails ? 'cursor-pointer hover:bg-slate-800/50 rounded' : 'cursor-default pointer-events-none'} flex justify-between items-center py-1 px-1 select-none">
                                <div class="flex items-center gap-1">
                                    <span class="text-[10px] text-slate-400">🎯 期權:</span>
                                    ${optBadge}
                                </div>
                                ${hasDetails ? `<span class="text-[10px] text-cyan-400 font-mono flex items-center gap-0.5">${isExpanded ? '收起 ▲' : '詳情 ▼'}</span>` : ''}
                            </summary>
                            ${hasDetails ? `
                                <div class="mt-1 pl-2.5 border-l-2 border-cyan-500/50 space-y-1 py-1.5 bg-slate-950/50 rounded-r">
                                    ${opt.strike_price ? `<div class="text-[10px] text-slate-300">行使價: <span class="text-cyan-300 font-mono font-bold">${opt.strike_price}</span></div>` : ''}
                                    ${opt.take_profit_target ? `<div class="text-[10px] text-emerald-400">平倉目標: <span class="font-mono">${opt.take_profit_target}</span></div>` : ''}
                                    ${opt.stop_loss ? `<div class="text-[10px] text-rose-400">停損目標: <span class="font-mono">${opt.stop_loss}</span></div>` : ''}
                                </div>
                            ` : ''}
                        </details>

                        <div class="pt-0.5 flex justify-end">
                            <button onclick="triggerML('${symbol}')" 
                                    class="text-[10px] bg-slate-800 hover:bg-cyan-950 text-cyan-400 hover:text-cyan-300 border border-slate-700 px-2 py-0.5 rounded transition">
                                🤖 ML 預測
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 渲染 Telegram 訊息卡片
        function renderFeed() {
            const chatBox = document.getElementById('chat-feed');
            
            const filteredFeed = rawFeedData.filter(msg => {
                if (currentFilter === 'ALL') return true;
                return msg.type === currentFilter;
            });

            if (filteredFeed.length === 0) {
                chatBox.innerHTML = `<div class="text-center text-slate-500 py-10 text-sm">無相關訊息紀錄...</div>`;
                return;
            }

            chatBox.innerHTML = filteredFeed.map((msg) => {
                let badgeStyle = "bg-slate-800 text-slate-300 border-slate-700";
                let borderStyle = "border-slate-800 bg-slate-900/80";
                
                if (msg.level === "danger") {
                    badgeStyle = "bg-red-950 text-red-400 border-red-800 animate-pulse";
                    borderStyle = "border-red-900/50 bg-red-950/20";
                } else if (msg.level === "warning") {
                    badgeStyle = "bg-amber-950 text-amber-400 border-amber-800";
                    borderStyle = "border-amber-900/50 bg-amber-950/20";
                } else if (msg.level === "success") {
                    badgeStyle = "bg-emerald-950 text-emerald-400 border-emerald-800";
                    borderStyle = "border-emerald-900/50 bg-emerald-950/20";
                } else if (msg.level === "purple") {
                    badgeStyle = "bg-purple-950 text-purple-300 border-purple-800";
                    borderStyle = "border-purple-900/50 bg-purple-950/20";
                } else if (msg.level === "cyan") {
                    badgeStyle = "bg-cyan-950 text-cyan-300 border-cyan-800";
                    borderStyle = "border-cyan-900/50 bg-cyan-950/20";
                }

                // 產生穩定 ID (完全脫離原本的 index 綁定)
                const rawString = `${msg.timestamp}_${msg.symbol}_${msg.title}`;
                const msgId = msg.id || 'uid_' + generateHash(rawString);
                
                const isExpanded = expandedFeedMessages.has(msgId);
                const formattedContent = msg.content.replace(/\n/g, '<br>');

                let contentArea = '';
                if (msg.type === 'OPTIONS') {
                    contentArea = `
                        <details ${isExpanded ? 'open' : ''} class="mt-2 border-t border-slate-800/80 pt-1.5 transition-all">
                            <summary onclick="handleToggle(event, '${msgId}', 'feed')" 
                                     class="text-xs font-semibold text-cyan-400 hover:text-cyan-300 flex items-center justify-between w-full py-1.5 px-2.5 rounded bg-slate-800/40 hover:bg-slate-800/80 transition select-none cursor-pointer">
                                <span>🎯 查看期權建議細節</span>
                                <span class="text-[10px] font-mono">${isExpanded ? '點擊折疊 ▲' : '點擊展開 ▼'}</span>
                            </summary>
                            <div class="mt-2 p-2.5 bg-slate-950/80 rounded-lg border border-slate-800 text-xs text-slate-300 leading-relaxed font-sans">
                                ${formattedContent}
                            </div>
                        </details>
                    `;
                } else {
                    contentArea = `<div class="text-xs text-slate-300 leading-relaxed font-sans">${formattedContent}</div>`;
                }

                return `
                    <div class="p-3.5 rounded-xl border ${borderStyle} shadow-md space-y-1.5 transition">
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] font-extrabold px-2 py-0.5 rounded border ${badgeStyle}">
                                [${msg.type}] ${msg.symbol}
                            </span>
                            <span class="text-[10px] text-slate-500 font-mono">${msg.timestamp}</span>
                        </div>
                        <div class="text-sm font-bold text-slate-100">${msg.title}</div>
                        ${contentArea}
                    </div>
                `;
            }).join('');
        }

        function filterFeed(type) {
            currentFilter = type;
            ['ALL', 'ALERT', 'ML', 'OPTIONS'].forEach(t => {
                const btn = document.getElementById(`filter-${t}`);
                if (btn) {
                    if (t === type) {
                        btn.className = "px-2.5 py-1 rounded bg-cyan-600 text-white font-bold";
                    } else {
                        btn.className = "px-2.5 py-1 rounded bg-slate-800 text-slate-400 hover:bg-slate-700";
                    }
                }
            });
            renderFeed();
        }

        async function addStock() {
            const input = document.getElementById('stock-input');
            const symbol = input.value.trim().toUpperCase();
            if (!symbol) return;

            try {
                await fetch('/api/stocks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ symbol })
                });
                input.value = '';
                fetchState();
            } catch (err) {
                alert("新增標的失敗");
            }
        }

        async function removeStock(symbol) {
            if (!confirm(`確定移除 ${symbol}？`)) return;
            try {
                await fetch(`/api/stocks/${symbol}`, { method: 'DELETE' });
                fetchState();
            } catch (err) {
                alert("刪除標的失敗");
            }
        }

        async function triggerML(symbol) {
            try {
                await fetch(`/api/predict/${symbol}`, { method: 'POST' });
                alert(`已送出 ${symbol} 的 13-ML 模型預測請求，結果隨後顯示於頻道中！`);
            } catch (err) {
                alert("觸發預測失敗");
            }
        }

        async function fetchState() {
            try {
                const res = await fetch('/api/state');
                const data = await res.json();

                if (data.states) {
                    latestStates = data.states;
                    renderTickerBar();
                }

                if (data.feed) {
                    rawFeedData = data.feed;
                    renderFeed();
                }

            } catch (err) {
                console.error("更新異常:", err);
            }
        }

        fetchState();
        setInterval(fetchState, 4000);
    </script>
</body>
</html>
